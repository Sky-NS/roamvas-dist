    <script>
      (function () {
        try {
          var raw = localStorage.getItem('roamvas-settings');
          var theme = raw ? (JSON.parse(raw).state || {}).theme : null;
          if (!theme) {
            var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            theme = systemDark ? 'dark' : 'light';
          }
          // Mirrors src/lib/themes.ts's id -> className mapping — this runs
          // before any bundled JS (so it can't import that file directly),
          // and needs to apply the *specific* named variant's class, not
          // just plain light/dark, or the very first paint uses the wrong
          // theme's colors until React mounts and corrects it a moment
          // later — visible as a flash/snap of the wrong colors on load.
          var classMap = {
            'light': '',
            'light-sand': 'theme-sand',
            'light-mint': 'theme-mint',
            'light-lavender': 'theme-lavender',
            'light-coral': 'theme-coral',
            'light-sky': 'theme-sky',
            'dark': 'dark',
            'dark-graphite': 'dark theme-graphite',
            'dark-emerald': 'dark theme-emerald',
            'dark-plum': 'dark theme-plum',
            'dark-wine': 'dark theme-wine',
            'dark-desert': 'dark theme-desert'
          };
          var classes = Object.prototype.hasOwnProperty.call(classMap, theme) ? classMap[theme] : '';
          if (classes) {
            classes.split(' ').forEach(function (c) { document.documentElement.classList.add(c); });
          }
        } catch (e) {}
      })();
    </script>
